services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-documind}
      # LISTEN_PORT must be set explicitly. The edoburu/pgbouncer image defaults
      # to listening on 5432, but the port mapping below, the healthcheck, and
      # the backend/worker `POSTGRES_PORT=6432` all target 6432. Without this the
      # healthcheck probed a closed port and stayed "unhealthy" forever, which
      # blocked worker and beat (they depend on pgbouncer being healthy) while
      # the backend silently could not reach the pooler over the Docker network.
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - storage_data:/tmp/documind_storage
    # Loads GEMINI_API_KEY_1..N (and all other backend settings) straight into
    # the container env so GeminiKeyRotator finds them. `environment:` below
    # still overrides any duplicate keys (e.g. POSTGRES_SERVER=pgbouncer).
    env_file:
      - ../backend/.env
    environment:
      # Gemini API keys — auto-detected by GeminiKeyRotator (Phase 12).
      # Add GEMINI_API_KEY_1, GEMINI_API_KEY_2, _3, etc. as needed — no code changes required.
      # - GEMINI_API_KEY_1: ${GEMINI_API_KEY_1}
      # - GEMINI_API_KEY_2: ${GEMINI_API_KEY_2}  # uncomment to pass a second key
      - POSTGRES_SERVER=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    volumes:
      - ../backend:/app
      - storage_data:/tmp/documind_storage
    # The Celery worker imports celery_app.py, never main.py, so it relies on
    # this env_file (plus the in-code bridge in get_key_rotator) to obtain the
    # Gemini keys. Without it, worker-side LLM tasks fall back to the mock.
    env_file:
      - ../backend/.env
    environment:
      - POSTGRES_SERVER=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    # H-3: every routed queue needs a consumer — export_queue and
    # ocr_gpu_queue are consumed here until a dedicated (GPU) worker exists.
    # NOTE: do NOT add `--max-tasks-per-child=0` here. Billiard's prefork pool
    # asserts `maxtasks is None or (int and > 0)`, so 0 crash-loops the worker
    # (verified: AssertionError in billiard/pool.py:241, queue backed up to 134
    # tasks). `--pool=solo` in scripts/run_worker_windows.ps1 does not hit this
    # because the solo pool ignores the setting.
    #
    # celery_app.conf sets worker_max_tasks_per_child=50, which costs a 65.7s
    # bge-m3 reload every 50 tasks. That is a real cost, but the recycle also
    # bounds memory growth from the ML models — removing it is a performance
    # trade-off that belongs in the directive's Phase 4 with measurement, not
    # an unmeasured flag here.
    #
    # P0-5: --concurrency MUST be explicit. Celery's prefork default is
    # os.cpu_count() (8 on this host), and each child owns its own SQLAlchemy
    # pool — so the worker's share of the database connection budget silently
    # changed with whatever machine it ran on. That is not sizable at deploy
    # time, which is what made the Supabase ceiling impossible to respect.
    #
    # Budget arithmetic against Supabase SESSION mode's project-wide cap of 15:
    #   API    DB_POOL_SIZE 3 + DB_MAX_OVERFLOW 2                      =  5
    #   worker 2 children x (WORKER_DB_POOL_SIZE 1 + OVERFLOW 1)       =  4
    #   beat   1 x (1 + 1)                                             =  2
    #   /health unpooled psycopg2 ping (transient, every 10s)          =  1
    #                                                                   ----
    #                                                                    12 / 15
    # Raise this together with the pool settings once the deployment moves to
    # TRANSACTION mode, where a server connection is held only for the length
    # of a transaction instead of the whole client session.
    command: celery -A app.workers.celery_app worker -Q main-queue,celery,export_queue,ocr_gpu_queue --concurrency=2 --loglevel=info

  # H-2: Celery Beat scheduler. Without it none of the beat_schedule entries
  # (health check, key rotation, daily digest, db cleanup, subscription/GST/
  # model checks, stale-review flagging) ever fire. Run EXACTLY ONE Beat
  # instance — a second one duplicates every scheduled task (double emails).
  # The schedule file lives in /tmp so it never pollutes the bind mount.
  beat:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    volumes:
      - ../backend:/app
    # Beat needs the same env as the worker: auto_health_check probes Gemini,
    # so the .env Gemini keys must be present or it will alert continuously.
    env_file:
      - ../backend/.env
    environment:
      - POSTGRES_SERVER=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
