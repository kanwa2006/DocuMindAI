version: '3.8'

# Run from the infrastructure/ directory:
#   cd infrastructure && docker compose up
# OR from the repo root:
#   docker compose -f infrastructure/docker-compose.yml up
#
# Build context is the REPO ROOT (..) so Dockerfile.backend can COPY
# backend/ as a subdirectory (Docker forbids COPY ../outside-context).

services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-documind}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      # PostgreSQL 14+ defaults to SCRAM-SHA-256. Without this pgbouncer
      # tries MD5 on the server leg, which the pg container refuses with
      # "cannot do SCRAM authentication: wrong password type".
      - AUTH_TYPE=scram-sha-256
      # No TLS on the pgbouncer→db leg in local docker networking.
      - SERVER_TLS_SSLMODE=disable
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      # Repo root so Dockerfile.backend can COPY backend/ as a subdir.
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - storage_data:/tmp/documind_storage
    # Loads GEMINI_API_KEY_1..N (and all other backend settings) straight into
    # the container env so GeminiKeyRotator finds them. `environment:` below
    # still overrides any duplicate keys (e.g. POSTGRES_SERVER=pgbouncer).
    env_file:
      - ../backend/.env
    environment:
      - POSTGRES_SERVER=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Clear DATABASE_URL so the POSTGRES_* vars above are used (local pgbouncer).
      - DATABASE_URL=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    volumes:
      - ../backend:/app
      - storage_data:/tmp/documind_storage
    # The Celery worker imports celery_app.py, never main.py, so it relies on
    # this env_file (plus the in-code bridge in get_key_rotator) to obtain the
    # Gemini keys. Without it, worker-side LLM tasks fall back to the mock.
    env_file:
      - ../backend/.env
    environment:
      - POSTGRES_SERVER=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    # H-3: every routed queue needs a consumer — export_queue and
    # ocr_gpu_queue are consumed here until a dedicated (GPU) worker exists.
    command: celery -A app.workers.celery_app worker -Q main-queue,celery,export_queue,ocr_gpu_queue --loglevel=info

  # H-2: Celery Beat scheduler. Without it none of the beat_schedule entries
  # (health check, key rotation, daily digest, db cleanup, subscription/GST/
  # model checks, stale-review flagging) ever fire. Run EXACTLY ONE Beat
  # instance — a second one duplicates every scheduled task (double emails).
  # The schedule file lives in /tmp so it never pollutes the bind mount.
  beat:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    volumes:
      - ../backend:/app
    # Beat needs the same env as the worker: auto_health_check probes Gemini,
    # so the .env Gemini keys must be present or it will alert continuously.
    env_file:
      - ../backend/.env
    environment:
      - POSTGRES_SERVER=pgbouncer
      - POSTGRES_PORT=6432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-documind}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
